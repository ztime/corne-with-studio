# Uncomment the following lines to enable the Corne RGB Underglow
# CONFIG_ZMK_RGB_UNDERGLOW=y
# CONFIG_WS2812_STRIP=y

# Uncomment the following line to enable the Corne OLED Display
# CONFIG_ZMK_DISPLAY=y
#
CONFIG_ZMK_KEYBOARD_NAME="CorneWStudio"

# SLeep
CONFIG_ZMK_SLEEP=y

# Report BOTH halves' battery to the host over BLE.
# Central fetches the peripheral (right) battery and proxies it as a 2nd Battery Service.
# (central-only flags; no-op on the peripheral build)
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# Disable 2M BLE PHY. Helps flaky BT hosts (e.g. Realtek RTL8852CU) pair/connect more reliably.
CONFIG_BT_CTLR_PHY_2M=n
